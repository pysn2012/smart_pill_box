---
# ============================================================
# ESP32-S3 语音助手 + 智能药盒（按时吃药打卡）
# ============================================================

substitutions:
  name: pill-box
  friendly_name: pill_box

  # 语音助手不同阶段的ID，用于内部逻辑判断和显示切换
  voice_assist_idle_phase_id: "1"
  voice_assist_listening_phase_id: "2"
  voice_assist_thinking_phase_id: "3"
  voice_assist_replying_phase_id: "4"
  voice_assist_not_ready_phase_id: "10"
  voice_assist_error_phase_id: "11"
  voice_assist_muted_phase_id: "12"

  # 仅有2种颜色
  bg_color: "000000"    # 黑色背景
  text_color: "FFFFFF"  # 白色文字

  # ---- 药盒参数 ----
  # 药盒格数（圆形药盒 8 格）
  med_slots: "8"
  # 每格步数：42 步进电机（1.8°/步），TMC2209 细分 1/16 → 3200 步/圈 → 每格 400 步
  # 公式：med_steps_per_slot = (200 × 细分) / 8（细分变了改这里）
  med_steps_per_slot: "400"
  # 打卡后绿灯 + OLED"已吃药"的显示时长，之后关闭所有提醒
  med_green_time: "10s"

  # ---- 到点 TTS 播报（走药盒喇叭）----
  # TTS 引擎实体 ID（Edge TTS 晓晓中文语音）；留空 = 不播报；此值编译期生效，改动需重刷
  tts_engine_entity: "tts.edgetts_zh_cn_xiaoxiaoneural"
  # 药盒本机 media_player 实体 ID：设置 → 设备 → pill_box → media_player 实体（核对一下实际 ID）
  med_media_player_entity: "media_player.pill_box_a07efc"

  # ---- 步进电机回差补偿 ----
  # 保留参数备用，0 = 不补偿
  med_slot_offset_steps: "0"

  # ---- 吃药提醒有效期（分钟）----
  # 超过吃药时间这么久还没打卡，就视为"超期"，不再提醒（待机页显示"过"）
  # 0 = 永不过期（一直提醒直到打卡）。60 = 1 小时内有效
  med_expire_minutes: "60"

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  min_version: 2025.12.0  # 要求的最低ESPHome版本
  name_add_mac_suffix: true  # 设备名后缀添加MAC地址，避免冲突
  on_boot:  # 开机启动逻辑
    priority: 600
    then:
      - script.execute: med_init           # 关灯
      - script.execute: med_publish_status # 发布吃药状态
      - script.execute: draw_display
      - delay: 30s
      - if:
          condition:
            lambda: return id(init_in_progress);
          then:
            - lambda: id(init_in_progress) = false;
            - script.execute: draw_display

logger:
  hardware_uart: USB_SERIAL_JTAG

api:
  on_client_connected:
    - script.execute: draw_display
  on_client_disconnected:
    - script.execute: draw_display

ota:
  - platform: esphome
    id: ota_esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # 关闭省电模式：省电模式会让射频周期性休眠，音频流式传输时产生突发延迟，
  power_save_mode: none
  ap:
    ssid: "pillbox-ap-Setup"
    password: "12345678"
  on_connect:
    - delay: 5s
    - script.execute: draw_display
  on_disconnect:
    - script.execute: draw_display

captive_portal:

# 待机页时钟/日程刷新：每 5 秒重画一次。
# 走 draw_display 的优先级逻辑——吃药提醒/已吃药/语音页面优先，
# 只有真正待机时才会画时钟，不会打断提醒和语音交互
interval:
  - interval: 5s
    then:
      - script.execute: draw_display

packages:
  hardware: !include packages/hardware.yaml
  time: !include packages/time.yaml
  fonts: !include packages/fonts.yaml
  sensor: !include packages/sensor.yaml
  script: !include packages/script.yaml
  voice: !include packages/voice-assistant.yaml
  # ---- 吃药打卡（日模式 / 周模式，在 HA 设备页用"吃药模式"切换）----
  medicine_common: !include packages/medicine-common.yaml
  mode_day: !include packages/mode-day.yaml
  mode_week: !include packages/mode-week.yaml
