# ============================================================
# 吃药打卡 - 周模式：每天只吃 1 次，每天时间相同
# 格位：12点钟=0位（空），顺时针格1~格7；周一→格1 ... 周日→格7
#       （格4 = 6点钟位置）；每天打卡结束后归位0
# 用法：与 medicine-common.yaml 一起启用；
#       在 HA 设备页用"吃药模式"选择器切换到"周模式"
#
# ★ 默认关闭约定（重要）：
#   - "每天吃药时间" 默认 00:00:00 = 关闭，此时周模式不提醒
#   - 改成实际时刻后才生效
#   - 一键复位：设备页的"清空吃药设置"按钮
#
# 注意：日模式下"每天吃药时间"不参与逻辑，只需在周模式下设置。
# day_of_week: 周日=1 ... 周六=7，换算 (day_of_week+5)%7 → 周一=0 ... 周日=6
# ============================================================

# 每天吃药时间（每天都一样，在 HA / 设备页设置，本地保存）；00:00:00 = 关闭
datetime:
  - platform: template
    type: TIME
    id: med_week_time
    name: 每天吃药时间
    time_id: ha_time
    optimistic: true
    restore_value: true
    initial_value: "00:00:00"

script:
  - id: med_scan_week
    mode: single
    then:
      - lambda: |-
          auto now = id(ha_time).now();
          id(med_due_flag) = false;
          id(med_rollover_flag) = false;
          if (!now.is_valid())
            return;
          // 跨天：清空打卡记录
          if (id(med_last_day) != now.day_of_year) {
            id(med_last_day) = now.day_of_year;
            id(med_taken_mask) = 0;
            id(med_rollover_flag) = true;
          }
          int nowm = now.hour * 60 + now.minute;
          int grace = ${med_expire_minutes};
          // day_of_week: 1=周日 ... 7=周六 → 换算为 周一=0 ... 周日=6
          int slot = (now.day_of_week + 5) % 7;
          int start = id(med_week_time).hour * 60 + id(med_week_time).minute;
          int due_slot = -1;
          // 提醒窗口：start <= now < start + 超时时长；00:00 = 关闭
          if (start > 0 && !(id(med_taken_mask) & (1 << slot)) &&
              nowm >= start && nowm < start + grace)
            due_slot = slot;
          id(med_target_slot) = due_slot;
          // 状态变化才触发（避免每30秒重复动作）；已在提醒同一格时按"贪睡间隔"到点重响
          bool same = id(med_show_alarm) && id(med_active_slot) == due_slot;
          int snz = (int) id(med_snooze_min).state;
          bool snooze_due = same && snz > 0 && id(med_last_alarm_min) >= 0 &&
                            (nowm - id(med_last_alarm_min)) >= snz;
          id(med_due_flag) = (due_slot >= 0) && (!same || snooze_due);
          // 正在提醒的格子已超期 → 撤提醒（红灯灭、状态回空闲）
          if (id(med_show_alarm) && !id(med_due_flag)) {
            bool a_expired = (start <= 0) || (nowm >= start + grace) ||
                             (id(med_active_slot) != slot);
            if (a_expired)
              id(med_expire_flag) = true;
          }
      - if:
          condition:
            lambda: return id(med_rollover_flag);
          then:
            - script.execute: med_alarm_off
            # 每天结束（跨天）：顺时针转回0位（12点钟，保险归位——正常情况打卡后已归位）
            - script.execute:
                id: med_go_to_slot
                target_slot: 0
      - if:
          condition:
            lambda: return id(med_expire_flag);
          then:
            - lambda: id(med_expire_flag) = false;
            - script.execute: med_alarm_off
      - if:
          condition:
            lambda: return id(med_due_flag);
          then:
            - script.execute: med_alarm_on
