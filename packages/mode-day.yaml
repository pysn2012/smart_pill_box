# ============================================================
# 吃药打卡 - 日模式：每日多次吃药
# 格位：12点钟=0位（空），顺时针格1~格7；第1次→格1 ... 第N次→格N（最多7次）
# 最后一剂打卡结束后转盘归位0
# 用法：与 medicine-common.yaml 一起启用；
#       在 HA 设备页用"吃药模式"选择器切换到"日模式"
#
# ★ 默认关闭约定（重要）：
#   - "每日吃药次数" 默认 0 = 未设置 → 任何时间都不会提醒
#   - "第1~8次吃药时间" 默认 00:00:00 = 关闭，扫描时直接跳过
#   - 要让第 i 次生效：先把"每日吃药次数"设成 >= i，再把"第i次吃药时间"改成实际时刻
#   - 一键复位：设备页的"清空吃药设置"按钮
#   → 这样烧录/重启后设备不会立刻进入吃药状态
#
# 注意：周模式下"第1~8次吃药时间"和"每日吃药次数"不参与逻辑。
# ============================================================

number:
  # 每日吃药次数（0~7）：0 = 未设置（不提醒），1~7 = 使用前 N 个时间实体
  - platform: template
    name: 每日吃药次数
    id: med_doses_per_day
    icon: mdi:pill-multiple
    min_value: 0
    max_value: 7
    step: 1
    initial_value: 0
    optimistic: true
    restore_value: true

# 每天各次吃药时间（在 HA / 设备页设置），00:00:00 = 关闭
datetime:
  - platform: template
    type: TIME
    id: med_time_1
    name: 第1次吃药时间
    time_id: ha_time
    optimistic: true
    restore_value: true
    initial_value: "00:00:00"
  - platform: template
    type: TIME
    id: med_time_2
    name: 第2次吃药时间
    time_id: ha_time
    optimistic: true
    restore_value: true
    initial_value: "00:00:00"
  - platform: template
    type: TIME
    id: med_time_3
    name: 第3次吃药时间
    time_id: ha_time
    optimistic: true
    restore_value: true
    initial_value: "00:00:00"
  - platform: template
    type: TIME
    id: med_time_4
    name: 第4次吃药时间
    time_id: ha_time
    optimistic: true
    restore_value: true
    initial_value: "00:00:00"
  - platform: template
    type: TIME
    id: med_time_5
    name: 第5次吃药时间
    time_id: ha_time
    optimistic: true
    restore_value: true
    initial_value: "00:00:00"
  - platform: template
    type: TIME
    id: med_time_6
    name: 第6次吃药时间
    time_id: ha_time
    optimistic: true
    restore_value: true
    initial_value: "00:00:00"
  - platform: template
    type: TIME
    id: med_time_7
    name: 第7次吃药时间
    time_id: ha_time
    optimistic: true
    restore_value: true
    initial_value: "00:00:00"
  - platform: template
    type: TIME
    id: med_time_8
    name: 第8次吃药时间
    time_id: ha_time
    optimistic: true
    restore_value: true
    initial_value: "00:00:00"

script:
  - id: med_scan_day
    mode: single
    then:
      - lambda: |-
          auto now = id(ha_time).now();
          id(med_due_flag) = false;
          id(med_rollover_flag) = false;
          if (!now.is_valid())
            return;
          // 跨天：清空打卡记录
          if (id(med_last_day) != now.day_of_year) {
            id(med_last_day) = now.day_of_year;
            id(med_taken_mask) = 0;
            id(med_rollover_flag) = true;
          }
          int nowm = now.hour * 60 + now.minute;
          int grace = ${med_expire_minutes};
          // 次数 0 = 未设置：循环不会执行，due_slot 保持 -1
          int nd = (int) id(med_doses_per_day).state;
          if (nd > ${med_slots}) nd = ${med_slots};
          int starts[${med_slots}] = {
            id(med_time_1).hour * 60 + id(med_time_1).minute,
            id(med_time_2).hour * 60 + id(med_time_2).minute,
            id(med_time_3).hour * 60 + id(med_time_3).minute,
            id(med_time_4).hour * 60 + id(med_time_4).minute,
            id(med_time_5).hour * 60 + id(med_time_5).minute,
            id(med_time_6).hour * 60 + id(med_time_6).minute,
            id(med_time_7).hour * 60 + id(med_time_7).minute,
            id(med_time_8).hour * 60 + id(med_time_8).minute
          };
          // 提醒窗口：start <= now < start + 超时时长
          // 找第一个"已到点、未打卡、未超期"的次数
          int due_slot = -1;
          for (int i = 0; i < nd; i++) {
            if (starts[i] <= 0)
              continue;
            if (id(med_taken_mask) & (1 << i))
              continue;
            if (nowm < starts[i] || nowm >= starts[i] + grace)
              continue;  // 未到点 或 已超期
            due_slot = i;
            break;
          }
          id(med_target_slot) = due_slot;
          // 状态变化才触发（避免每30秒重复动作）；已在提醒同一格时按"贪睡间隔"到点重响
          bool same = id(med_show_alarm) && id(med_active_slot) == due_slot;
          int snz = (int) id(med_snooze_min).state;
          bool snooze_due = same && snz > 0 && id(med_last_alarm_min) >= 0 &&
                            (nowm - id(med_last_alarm_min)) >= snz;
          id(med_due_flag) = (due_slot >= 0) && (!same || snooze_due);
          // 正在提醒的格子已超期 → 撤提醒（红灯灭、状态回空闲）
          if (id(med_show_alarm) && !id(med_due_flag)) {
            int a = id(med_active_slot);
            bool a_expired = (a < 0) || (a >= nd) || (starts[a] <= 0) || (nowm >= starts[a] + grace);
            if (a_expired)
              id(med_expire_flag) = true;
          }
      - if:
          condition:
            lambda: return id(med_rollover_flag);
          then:
            - script.execute: med_alarm_off
            # 每天结束（跨天）：顺时针转回0位（12点钟，保险归位——正常情况打卡后已归位）
            - script.execute:
                id: med_go_to_slot
                target_slot: 0
      - if:
          condition:
            lambda: return id(med_expire_flag);
          then:
            - lambda: id(med_expire_flag) = false;
            - script.execute: med_alarm_off
      - if:
          condition:
            lambda: return id(med_due_flag);
          then:
            - script.execute: med_alarm_on
