# ============================================================
# 时间同步（SNTP，不依赖 Home Assistant）
# 沿用 id: ha_time —— mode-day / mode-week 里的 id(ha_time).now() 无需改动
# timezone 必须写，否则比本地时间差 8 小时，吃药提醒时间全错
# ============================================================
time:
  - platform: sntp
    id: ha_time
    timezone: Asia/Shanghai
    servers:
      - ntp.aliyun.com
      - cn.pool.ntp.org
    # V15 排查：药盒模块注释（恢复时取消注释）
    # on_time_sync:
    #   - script.execute: med_scan

# ---- 备用时间源（可选）----
