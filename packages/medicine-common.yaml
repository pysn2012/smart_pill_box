# ============================================================
# 吃药打卡 - 公共模块（模式选择 / LED / 打卡按键 / 步进电机 / 状态脚本）
# 与 mode-day.yaml 和 mode-week.yaml 搭配使用（两个都启用，
# 在 HA 设备页用"吃药模式"选择器切换）
#
# 逻辑约定：
#   - 格子编号从 0 开始（0~7），对外显示为"第1格~第8格"
#   - 到点 → 红灯 + OLED"该吃药了" + 电机转到对应格
#   - 没打卡就一直提醒，红灯不灭，直到打卡为止（已无"时间段"概念）
#   - 按键打卡 → 红灯灭、绿灯亮、OLED"已吃药"，${med_green_time} 后全部关闭
#   - 是否吃药以按键打卡为准；跨天自动清空当天打卡记录
#
# ★ "关闭"约定：
#   - 吃药时间为 00:00（0 分）= 关闭；"每日吃药次数" 为 0 = 未设置
#   - 两者都默认关闭，所以烧录/重启后不会立刻进入吃药状态
#   - "清空吃药设置"按钮 = 把所有时间/次数一键复位为关闭
# ============================================================

# 红灯：到点提醒 / 绿灯：已吃药（2026-10-24 换板 LC-ESP32S3：红=GPIO1 绿=GPIO2）
output:
  - platform: gpio
    id: med_red
    pin: GPIO1
  - platform: gpio
    id: med_green
    pin: GPIO2

# 步进电机（TMC2209 STEP/DIR 接法，兼容 a4988 平台）
# 2026-10-24 换板（LC-ESP32S3）：EN=GPIO8 STEP=GPIO9 DIR=GPIO10
# TMC 驱动没有 SLEEP 脚，对应的是 ENABLE 脚（低电平使能），
# 因此 sleep_pin 需要 inverted: true；到达目标位置后驱动自动休眠（EN=高，断电）
# 若实际转向相反，给 dir_pin 加 inverted: true
stepper:
  - platform: a4988
    id: med_stepper
    step_pin: GPIO9
    # V16 顺时针：实测逆时针，取反 DIR 电平（2026-10-29）；若装回后又反向，删掉 inverted 即可
    dir_pin:
      number: GPIO10
      inverted: true
    sleep_pin:
      number: GPIO8
      inverted: true
    max_speed: 250 steps/s
    acceleration: 400 steps/s^2
    deceleration: 400 steps/s^2

# 吃药模式选择（HA 设备页设置，断电保存）
select:
  - platform: template
    id: med_mode
    name: 吃药模式
    icon: mdi:calendar-clock
    optimistic: true
    restore_value: true
    initial_option: 日模式
    options:
      - 日模式
      - 周模式
    on_value:
      then:
        # 切换模式时清掉当前提醒，下个扫描周期按新模式重新判断
        - script.execute: med_alarm_off
        - output.turn_off: med_green

number:
  # 贪睡间隔（分钟）：提醒后未打卡，每隔这么久再响一次；0 = 不重复
  - platform: template
    name: 贪睡间隔(分钟)
    id: med_snooze_min
    icon: mdi:alarm-snooze
    min_value: 0
    max_value: 60
    step: 5
    initial_value: 0
    optimistic: true
    restore_value: true

# 全局变量（Globals）
globals:
  # 是否处于吃药提醒状态（红灯）
  - id: med_show_alarm
    type: bool
    restore_value: false
    initial_value: "false"
  # 打卡后是否处于"已吃药"显示状态（绿灯）
  - id: med_show_taken
    type: bool
    restore_value: false
    initial_value: "false"
  # 打卡位图：bit i = 第 i 格（第 i 次）已吃药
  - id: med_taken_mask
    type: int
    restore_value: true
    initial_value: "0"
  # 当前提醒对应的格子（-1 = 无）
  - id: med_active_slot
    type: int
    restore_value: false
    initial_value: "-1"
  # 扫描后计算出的待提醒格子（-1 = 无），供 med_alarm_on 使用
  - id: med_target_slot
    type: int
    restore_value: false
    initial_value: "-1"
  # 扫描结果标志（由模式模块的扫描脚本设置）
  - id: med_due_flag
    type: bool
    restore_value: false
    initial_value: "false"
  - id: med_rollover_flag
    type: bool
    restore_value: false
    initial_value: "false"
  # 正在提醒的格子已超期（超过 ${med_expire_minutes} 分钟），需撤提醒
  - id: med_expire_flag
    type: bool
    restore_value: false
    initial_value: "false"
  # 电机当前所在格（0 起，开机假定停在格 0）
  - id: med_current_slot
    type: int
    restore_value: false
    initial_value: "0"
  # 电机累计步数镜像（与驱动内部位置同步，用于绝对定位）
  - id: med_steps_pos
    type: int
    restore_value: false
    initial_value: "0"
  # 上次扫描时的 day_of_year（用于跨天重置打卡记录）
  - id: med_last_day
    type: int
    restore_value: false
    initial_value: "-1"
  # 上次触发提醒时的"当日分钟数"（用于贪睡重响；-1 = 无）
  - id: med_last_alarm_min
    type: int
    restore_value: false
    initial_value: "-1"

# 设备页面上的两个按钮
#   - 测试提醒：按格0走一次完整提醒流程（红灯 + OLED + 电机），验证硬件用
#   - 清空吃药设置：把次数/时间全部复位成"关闭"，并清掉当前提醒与当日打卡
button:
  - platform: template
    name: 测试提醒
    icon: mdi:bell-ring-outline
    on_press:
      - lambda: id(med_target_slot) = 0;
      - script.execute: med_alarm_on

  - platform: template
    name: 清空吃药设置
    icon: mdi:eraser
    on_press:
      # 每日吃药次数归零（0 = 未设置）
      - number.set:
          id: med_doses_per_day
          value: 0
      # 日模式的 8 个时间归零（00:00 = 关闭）
      - datetime.time.set:
          id: med_time_1
          time: "00:00:00"
      - datetime.time.set:
          id: med_time_2
          time: "00:00:00"
      - datetime.time.set:
          id: med_time_3
          time: "00:00:00"
      - datetime.time.set:
          id: med_time_4
          time: "00:00:00"
      - datetime.time.set:
          id: med_time_5
          time: "00:00:00"
      - datetime.time.set:
          id: med_time_6
          time: "00:00:00"
      - datetime.time.set:
          id: med_time_7
          time: "00:00:00"
      - datetime.time.set:
          id: med_time_8
          time: "00:00:00"
      # 周模式时间归零
      - datetime.time.set:
          id: med_week_time
          time: "00:00:00"
      # 清掉当前提醒状态与当日打卡记录
      - lambda: |-
          id(med_taken_mask) = 0;
          id(med_last_day) = -1;
          id(med_show_taken) = false;
      - output.turn_off: med_green
      - script.execute: med_alarm_off

# 打卡按键（GPIO5，低电平按下；2026-10-24 换板 LC-ESP32S3）
binary_sensor:
  - platform: gpio
    id: med_button
    name: 吃药打卡
    pin:
      number: GPIO5
      mode: INPUT_PULLUP
      inverted: true
    filters:
      - delayed_on: 20ms
    on_press:
      - script.execute: med_taken_seq

# 状态上报（Text Sensor / Sensor）
text_sensor:
  - platform: template
    id: med_status
    name: 吃药状态
    icon: mdi:pill

sensor:
  - platform: template
    id: med_slot_sensor
    name: 当前药格
    icon: mdi:rotate-360
    accuracy_decimals: 0
    update_interval: never

# 每 30 秒扫描一次当前模式的吃药时间表
interval:
  - interval: 30s
    then:
      - script.execute: med_scan

# 脚本（Scripts）
script:
  # 扫描调度：按 HA 里选择的模式分发（select.is 条件，官方文档写法）
  - id: med_scan
    mode: single
    then:
      - if:
          condition:
            select.is:
              id: med_mode
              options: "日模式"
          then:
            - script.execute: med_scan_day
          else:
            - script.execute: med_scan_week

  # 开机初始化：关灯
  - id: med_init
    mode: single
    then:
      - output.turn_off: med_red
      - output.turn_off: med_green

  # 电机转到指定格（顺时针单向：delta=(目标-当前+8)%8，不走反向近路）
  # 格位约定：12点钟位置 = 0位（空/基准），顺时针为格1~格7（格4=6点钟）
  # 开机/装配时把 0 位对准取药口（12点）
  - id: med_go_to_slot
    mode: single
    parameters:
      target_slot: int
    then:
      - lambda: |-
          int delta = ((target_slot - id(med_current_slot)) % ${med_slots} + ${med_slots}) % ${med_slots};
          id(med_steps_pos) += delta * ${med_steps_per_slot};
          id(med_current_slot) = target_slot;
          id(med_slot_sensor).publish_state((float) id(med_current_slot));
      - stepper.set_target:
          id: med_stepper
          # 回差补偿：目标位整体前移 ${med_slot_offset_steps} 步（-1°），
          # med_steps_pos 仍保持标准 45°/格 累计值，补偿不随格数发散
          target: !lambda return id(med_steps_pos) + ${med_slot_offset_steps};

  # 进入提醒状态：红灯 + OLED 提醒 + 电机顺时针转 1 格（相对步进）
  - id: med_alarm_on
    mode: single
    then:
      - lambda: |-
          id(med_show_alarm) = true;
          id(med_show_taken) = false;
          id(med_active_slot) = id(med_target_slot);
          auto now = id(ha_time).now();
          id(med_last_alarm_min) = now.is_valid() ? (now.hour * 60 + now.minute) : -1;
      # V16 绝对格位（2026-10-29 定稿）：12点钟=0位（空），顺时针格1~格7
      # 第N剂 → 格N（周模式：周N → 格N，周四=格4=6点钟）
      - script.execute:
          id: med_go_to_slot
          target_slot: !lambda return id(med_active_slot) + 1;
      - output.turn_on: med_red
      - script.execute: med_publish_status
      # 到点 TTS 播报（走药盒喇叭；tts_engine_entity 留空则跳过）
      - if:
          condition:
            lambda: return std::string("${tts_engine_entity}") != "";
          then:
            - if:
                condition:
                  api.is_connected:
                then:
                  - logger.log:
                      tag: tts
                      format: "TTS call: engine=%s player=%s msg=%s"
                      args:
                        - '"${tts_engine_entity}"'
                        - '"${med_media_player_entity}"'
                        - |-
                          (id(med_mode).current_option() == "日模式")
                            ? ("主人，第" + std::to_string(id(med_active_slot) + 1) + "次吃药时间到了").c_str()
                            : "主人，今天吃药时间到了"
                  - homeassistant.service:
                      service: tts.speak
                      data:
                        entity_id: ${tts_engine_entity}
                        media_player_entity_id: ${med_media_player_entity}
                        message: !lambda |-
                          if (id(med_mode).current_option() == "日模式")
                            return "主人，第" + std::to_string(id(med_active_slot) + 1) + "次吃药时间到了";
                          return std::string("主人，今天吃药时间到了");
                else:
                  - logger.log:
                      tag: tts
                      level: WARN
                      format: "TTS skipped: HA API not connected"
      - script.execute: draw_display

  # 退出提醒状态（所有到期次数已打卡 / 跨天重置 / 切换模式）
  - id: med_alarm_off
    mode: single
    then:
      - lambda: |-
          id(med_show_alarm) = false;
          id(med_last_alarm_min) = -1;
      - output.turn_off: med_red
      - script.execute: med_publish_status
      - script.execute: draw_display

  # 按键打卡：红灯灭 → 绿灯 + OLED"已吃药"，${med_green_time} 后全部关闭
  - id: med_taken_seq
    mode: restart
    then:
      - if:
          condition:
            lambda: return id(med_show_alarm) || id(med_show_taken);
          then:
            - lambda: |-
                if (id(med_show_alarm) && id(med_active_slot) >= 0)
                  id(med_taken_mask) |= (1 << id(med_active_slot));
                id(med_show_alarm) = false;
                id(med_show_taken) = true;
            - output.turn_off: med_red
            - output.turn_on: med_green
            - script.execute: med_publish_status
            - script.execute: draw_display
            - delay: ${med_green_time}
            - output.turn_off: med_green
            - lambda: id(med_show_taken) = false;
            # V16 吃药结束归位：周模式每次打卡后回0位；
            # 日模式最后一剂打卡后回0位（未吃完/未到最后一剂时停在当前格）
            - if:
                condition:
                  lambda: |-
                    if (id(med_mode).current_option() == "周模式")
                      return true;
                    int nd = (int) id(med_doses_per_day).state;
                    return id(med_active_slot) >= nd - 1;
                then:
                  - script.execute:
                      id: med_go_to_slot
                      target_slot: 0
            - script.execute: draw_display

  # 发布吃药状态到 HA（按模式区分叫法：日模式=第N次，周模式=周X）
  - id: med_publish_status
    mode: single
    then:
      - lambda: |-
          if (id(med_show_alarm) || id(med_show_taken)) {
            std::string label;
            if (id(med_mode).current_option() == "日模式") {
              label = "第" + std::to_string(id(med_active_slot) + 1) + "次";
            } else {
              static const char *WD[] = {"星期一", "星期二", "星期三", "星期四", "星期五", "星期六", "星期日"};
              int s = id(med_active_slot);
              label = (s >= 0 && s < 7) ? std::string(WD[s]) : std::string("今天");
            }
            if (id(med_show_alarm))
              id(med_status).publish_state("该吃药 " + label);
            else
              id(med_status).publish_state("已吃药 " + label);
          } else {
            id(med_status).publish_state("空闲");
          }
