# ============================================================
# 硬件引脚 —— 2026-10-24 换板：立创·天空星 LC-ESP32S3
# 主控 ESP32-S3R8N8（8MB Flash + 8MB Octal PSRAM），引脚与 lc-esp32s3 配置一致
# OLED: SCL=GPIO42 SDA=GPIO41 | INMP441: SCK=GPIO16 WS=GPIO17 SD=GPIO18
# MAX98357A: DIN=GPIO38 BCLK=GPIO39 LRC=GPIO40
# TMC2209: EN=GPIO7 STEP=GPIO9 DIR=GPIO10 | 红LED=GPIO1 绿LED=GPIO2 打卡按键=GPIO5
# ============================================================
esp32:
  variant: esp32s3
  flash_size: 8MB
  cpu_frequency: 240MHz
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_ESP32S3_DEFAULT_CPU_FREQ_240: "y"
      CONFIG_ESP32S3_DATA_CACHE_64KB: "y"
      CONFIG_ESP32S3_DATA_CACHE_LINE_64B: "y"
      # 硬关蓝牙协议栈：音频流式传输 + BLE 是 ESPHome 官方明确警告的资源冲突组合，
      # 这里显式置 n，确保蓝牙控制器完全不启动（省 flash 与内存）
      CONFIG_BT_ENABLED: "n"

psram:
  mode: octal
  speed: 80MHz

# I2C 总线（OLED: SCL=GPIO42, SDA=GPIO41，与 lc-esp32s3 一致）
# frequency 400kHz：默认 50kHz 刷一帧 OLED 要阻塞主循环 ~220ms，
# 语音流式传输期间会卡住 API 发包
i2c:
  - id: i2c_bus
    scl: GPIO42
    sda: GPIO41
    frequency: 400kHz

# I2S 音频总线
i2s_audio:
  # INMP441: SCK=GPIO16, WS=GPIO17（SD 在语音模块里=GPIO18）
  - id: i2s_mic
    i2s_lrclk_pin: GPIO17
    i2s_bclk_pin: GPIO16
  # MAX98357A: BCLK=GPIO39, LRC=GPIO40（DIN 在语音模块里=GPIO38）
  - id: i2s_out_bus
    i2s_lrclk_pin: GPIO40
    i2s_bclk_pin: GPIO39

# 颜色定义 (Colors): 将HEX颜色值定义为ID，方便在显示逻辑中引用
color:
  - id: bg_color
    hex: ${bg_color}
  - id: text_color
    hex: ${text_color}

# 显示屏 (Display): OLED
display:
  - platform: ssd1306_i2c
    id: oled128
    model: "SSD1306 128x64"
    i2c_id: i2c_bus
    address: 0x3C
    update_interval: never
    # 定义了多个显示页面，每个页面是一个独立的绘制函数
    pages:
      # 待机页面：日期时间 + 今日吃药安排（每行 2 个）
      - id: idle_page
        lambda: |-
          it.fill(id(bg_color));
          auto now = id(ha_time).now();
          if (!now.is_valid()) {
            it.printf(0, 20, id(font_main), id(text_color), "时间同步中");
            return;
          }
          static const char *WD[] = {"周一", "周二", "周三", "周四", "周五", "周六", "周日"};
          // 第1行：日期 + 星期
          it.printf(0, 0, id(font_small), id(text_color), "%d月%d日 %s",
                    now.month, now.day_of_month, WD[(now.day_of_week + 5) % 7]);
          // 第2行：时间
          it.printf(0, 13, id(font_main), id(text_color), "%02d:%02d", now.hour, now.minute);
          // 第3~4行：今日吃药安排，每行 2 个："1)08:00已  2)12:00未"
          if (id(med_mode).state == "日模式") {
            int nd = (int) id(med_doses_per_day).state;
            if (nd > ${med_slots}) nd = ${med_slots};
            if (nd <= 0) {
              it.printf(0, 34, id(font_small), id(text_color), "未设置吃药时间");
            } else {
              const datetime::TimeEntity *tms[${med_slots}] = {
                id(med_time_1), id(med_time_2), id(med_time_3), id(med_time_4),
                id(med_time_5), id(med_time_6), id(med_time_7), id(med_time_8)};
              int shown = 0;
              for (int i = 0; i < nd && shown < 4; i++) {
                int st = tms[i]->hour * 60 + tms[i]->minute;
                if (st <= 0)
                  continue;  // 00:00 = 关闭
                int y = 32 + (shown / 2) * 14;
                int x = (shown % 2) * 64;
                it.printf(x, y, id(font_small), id(text_color), "%d)%02d:%02d%s",
                          i + 1, tms[i]->hour, tms[i]->minute,
                          (id(med_taken_mask) & (1 << i)) ? "已" : "未");
                shown++;
              }
              if (shown == 0)
                it.printf(0, 34, id(font_small), id(text_color), "未设置吃药时间");
            }
          } else {
            // 周模式：每天同一时间
            int st = id(med_week_time).hour * 60 + id(med_week_time).minute;
            if (st > 0)
              it.printf(0, 34, id(font_small), id(text_color), "每天 %02d:%02d %s",
                        id(med_week_time).hour, id(med_week_time).minute,
                        (id(med_taken_mask) & (1 << ((now.day_of_week + 5) % 7))) ? "已" : "未");
            else
              it.printf(0, 34, id(font_small), id(text_color), "未设置吃药时间");
          }
      # 监听页面
      - id: listening_page
        lambda: |-
          it.fill(id(bg_color));
          it.printf(30, 20, id(font_main), id(text_color), "%s", "聆听状态");
      # 思考页面
      - id: thinking_page
        lambda: |-
          it.fill(id(bg_color));
          it.printf(0, 0, id(font_main), id(text_color), "%s", "思考:");
          const int start_y = 16;
          const int line_height = 12;
          const int max_width = 128;
          std::string text = id(text_request).state.c_str();
          int y = start_y;
          std::string line;
          for (size_t i = 0; i < text.size() && y < 64;) {
            uint8_t c = text[i];
            int len =
              (c & 0x80) == 0x00 ? 1 :
              (c & 0xE0) == 0xC0 ? 2 :
              (c & 0xF0) == 0xE0 ? 3 : 4;
            std::string next = line + text.substr(i, len);
            int x1, y1, w, h;
            it.get_text_bounds(
              0, y,
              next.c_str(),
              id(font_small),
              esphome::display::TextAlign::TOP_LEFT,
              &x1, &y1, &w, &h
            );
            if (w > max_width) {
              it.printf(0, y, id(font_small), id(text_color), "%s", line.c_str());
              y += line_height;
              line.clear();
            } else {
              line = next;
              i += len;
            }
          }
          if (!line.empty() && y < 64) {
            it.printf(0, y, id(font_small), id(text_color), "%s", line.c_str());
          }
      # 回复页面
      - id: replying_page
        lambda: |-
          it.fill(id(bg_color));
          it.printf(0, 0, id(font_main), id(text_color), "%s", "回复:");
          const int start_y = 16;
          const int line_height = 12;
          const int max_width = 128;
          std::string text = id(text_response).state.c_str();
          int y = start_y;
          std::string line;
          for (size_t i = 0; i < text.size() && y < 64;) {
            uint8_t c = text[i];
            int len =
              (c & 0x80) == 0x00 ? 1 :
              (c & 0xE0) == 0xC0 ? 2 :
              (c & 0xF0) == 0xE0 ? 3 : 4;
            std::string next = line + text.substr(i, len);
            int x1, y1, w, h;
            it.get_text_bounds(
              0, y,
              next.c_str(),
              id(font_small),
              esphome::display::TextAlign::TOP_LEFT,
              &x1, &y1, &w, &h
            );
            if (w > max_width) {
              it.printf(0, y, id(font_small), id(text_color), "%s", line.c_str());
              y += line_height;
              line.clear();
            } else {
              line = next;
              i += len;
            }
          }
          if (!line.empty() && y < 64) {
            it.printf(0, y, id(font_small), id(text_color), "%s", line.c_str());
          }
      # 错误页面
      - id: error_page
        lambda: |-
          it.fill(id(bg_color));
          it.printf(25, 20, id(font_main), id(text_color), "%s", "呃,出错了");
      # 无Home Assistant页面
      - id: no_ha_page
        lambda: |-
          it.fill(id(bg_color));
          it.printf(25, 20, id(font_main), id(text_color), "%s", "未连接HA");
      # 无WiFi页面
      - id: no_wifi_page
        lambda: |-
          it.fill(id(bg_color));
          it.printf(25, 20, id(font_main), id(text_color), "%s", "未连接wifi");
      # 初始化页面
      - id: initializing_page
        lambda: |-
          it.fill(id(bg_color));
          it.printf(35, 20, id(font_main), id(text_color), "%s", "加载中");
      # 静音页面
      - id: muted_page
        lambda: |-
          it.fill(id(bg_color));
          it.printf(35, 20, id(font_main), id(text_color), "%s", "静音状态");
      # 吃药提醒页面（引用 medicine-common 的 med_active_slot / med_show_alarm）
      # 按模式区分叫法：日模式=第N次，周模式=周X吃药
      - id: med_alarm_page
        lambda: |-
          it.fill(id(bg_color));
          it.printf(64, 8, id(font_main), id(text_color), esphome::display::TextAlign::TOP_CENTER, "该吃药了");
          if (id(med_mode).state == "日模式") {
            it.printf(64, 32, id(font_main), id(text_color), esphome::display::TextAlign::TOP_CENTER, "第%d次", (int) id(med_active_slot) + 1);
          } else {
            static const char *WD[] = {"周一", "周二", "周三", "周四", "周五", "周六", "周日"};
            int s = id(med_active_slot);
            it.printf(64, 32, id(font_main), id(text_color), esphome::display::TextAlign::TOP_CENTER, "%s吃药",
                      (s >= 0 && s < 7) ? WD[s] : "今天");
          }
      - id: med_ok_page
        lambda: |-
          it.fill(id(bg_color));
          it.printf(64, 20, id(font_main), id(text_color), esphome::display::TextAlign::TOP_CENTER, "已吃药");
