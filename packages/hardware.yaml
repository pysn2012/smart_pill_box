# ============================================================
# 硬件引脚 —— 已按 PCB/pillbox 控制板原理图核对（2026-09-28 版，
# 核对图：PCB/pillbox_Schematic1_1_1-P1_2026-10-05.png）
# 主控：合宙 ESP32-S3 核心板（直插），可用引脚 G0~G18
# OLED: SCL=G12 SDA=G11 | INMP441: SCK=G13 WS=G14 SD=G15
# MAX98357A: DIN=G16 BCLK=G17 LRC=G18 | TMC2209: EN=G04 STEP=G05 DIR=G06
# ============================================================
esp32:
  variant: esp32s3
  flash_size: 16MB
  cpu_frequency: 240MHz
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_ESP32S3_DEFAULT_CPU_FREQ_240: "y"
      CONFIG_ESP32S3_DATA_CACHE_64KB: "y"
      CONFIG_ESP32S3_DATA_CACHE_LINE_64B: "y"
      # 硬关蓝牙协议栈：音频流式传输 + BLE 是 ESPHome 官方明确警告的资源冲突组合，
      # 这里显式置 n，确保蓝牙控制器完全不启动（省 flash 与内存）
      CONFIG_BT_ENABLED: "n"

# PSRAM 必须"确认存在"（ignore_not_found: false）才能启用下面 network 的
# PSRAM 感知高性能优化（TCP 窗口 512KB + 512 个 WiFi RX 缓冲）。
# 本板 PSRAM 已实测可用（日志 Available: YES / 8192 KB），可安全关闭容错。
psram:
  mode: octal
  speed: 80MHz
  ignore_not_found: false

# ============================================================
# 网络栈优化 —— 针对"语音流式传输时设备答不上 HA 请求"的核心修复
#
# 机理：lwIP 默认每连接发缓冲只有 5744 字节。语音音频是突发式写入，
#       缓冲一满发送立刻停住，API 任务被堵死，设备无法在 10 秒内回应
#       HA 的 DisconnectRequest（HA 日志实测：Timeout waiting for
#       DisconnectResponse after 10.0s）→ HA 强关连接 → 设备侧掉线
#       → voice_assistant 停麦回 IDLE（表现为"聆听状态死掉"）。
#
# tcp_send_buffer 是 ESPHome 2026.9.0 新增选项，2026.8.x 上不存在，
# 因此必须先升级 ESPHome 再编译本配置。
# ============================================================
network:
  enable_high_performance: true
  tcp_send_buffer: 16kB

# I2C 总线（OLED: SCL=12, SDA=11）
# frequency 必须提高到 400kHz：默认 50kHz 刷一帧 OLED 要阻塞主循环 ~220ms，
# 语音流式传输期间会卡住 API 发包（日志中的 "took a long time (220ms)" 即此）
i2c:
  - id: i2c_bus
    scl: GPIO12
    sda: GPIO11
    frequency: 400kHz

# I2S 音频总线
i2s_audio:
  # INMP441: SCK=13, WS=14（SD 在语音模块里=GPIO15）
  - id: i2s_mic
    i2s_lrclk_pin: GPIO14
    i2s_bclk_pin: GPIO13
  # MAX98357A: BCLK=17, LRC=18（DIN 在语音模块里=GPIO16）
  - id: i2s_out_bus
    i2s_lrclk_pin: GPIO18
    i2s_bclk_pin: GPIO17

# 颜色定义 (Colors): 将HEX颜色值定义为ID，方便在显示逻辑中引用
color:
  - id: bg_color
    hex: ${bg_color}
  - id: text_color
    hex: ${text_color}

# 显示屏 (Display): OLED
display:
  - platform: ssd1306_i2c
    id: oled128
    model: "SSD1306 128x64"
    i2c_id: i2c_bus
    address: 0x3C
    update_interval: never
    # 定义了多个显示页面，每个页面是一个独立的绘制函数
    pages:
      # 空闲页面
      - id: idle_page
        lambda: |-
          it.fill(id(bg_color));
          it.printf(30, 20, id(font_main), id(text_color), "%s", "待机状态");
      # 监听页面
      - id: listening_page
        lambda: |-
          it.fill(id(bg_color));
          it.printf(30, 20, id(font_main), id(text_color), "%s", "聆听状态");
      # 思考页面
      - id: thinking_page
        lambda: |-
          it.fill(id(bg_color));
          it.printf(0, 0, id(font_main), id(text_color), "%s", "思考:");
          const int start_y = 16;
          const int line_height = 12;
          const int max_width = 128;
          std::string text = id(text_request).state.c_str();
          int y = start_y;
          std::string line;
          for (size_t i = 0; i < text.size() && y < 64;) {
            uint8_t c = text[i];
            int len =
              (c & 0x80) == 0x00 ? 1 :
              (c & 0xE0) == 0xC0 ? 2 :
              (c & 0xF0) == 0xE0 ? 3 : 4;
            std::string next = line + text.substr(i, len);
            int x1, y1, w, h;
            it.get_text_bounds(
              0, y,
              next.c_str(),
              id(font_small),
              esphome::display::TextAlign::TOP_LEFT,
              &x1, &y1, &w, &h
            );
            if (w > max_width) {
              it.printf(0, y, id(font_small), id(text_color), "%s", line.c_str());
              y += line_height;
              line.clear();
            } else {
              line = next;
              i += len;
            }
          }
          if (!line.empty() && y < 64) {
            it.printf(0, y, id(font_small), id(text_color), "%s", line.c_str());
          }
      # 回复页面
      - id: replying_page
        lambda: |-
          it.fill(id(bg_color));
          it.printf(0, 0, id(font_main), id(text_color), "%s", "回复:");
          const int start_y = 16;
          const int line_height = 12;
          const int max_width = 128;
          std::string text = id(text_response).state.c_str();
          int y = start_y;
          std::string line;
          for (size_t i = 0; i < text.size() && y < 64;) {
            uint8_t c = text[i];
            int len =
              (c & 0x80) == 0x00 ? 1 :
              (c & 0xE0) == 0xC0 ? 2 :
              (c & 0xF0) == 0xE0 ? 3 : 4;
            std::string next = line + text.substr(i, len);
            int x1, y1, w, h;
            it.get_text_bounds(
              0, y,
              next.c_str(),
              id(font_small),
              esphome::display::TextAlign::TOP_LEFT,
              &x1, &y1, &w, &h
            );
            if (w > max_width) {
              it.printf(0, y, id(font_small), id(text_color), "%s", line.c_str());
              y += line_height;
              line.clear();
            } else {
              line = next;
              i += len;
            }
          }
          if (!line.empty() && y < 64) {
            it.printf(0, y, id(font_small), id(text_color), "%s", line.c_str());
          }
      # 错误页面
      - id: error_page
        lambda: |-
          it.fill(id(bg_color));
          it.printf(25, 20, id(font_main), id(text_color), "%s", "呃,出错了");
      # 无Home Assistant页面
      - id: no_ha_page
        lambda: |-
          it.fill(id(bg_color));
          it.printf(25, 20, id(font_main), id(text_color), "%s", "未连接HA");
      # 无WiFi页面
      - id: no_wifi_page
        lambda: |-
          it.fill(id(bg_color));
          it.printf(25, 20, id(font_main), id(text_color), "%s", "未连接wifi");
      # 初始化页面
      - id: initializing_page
        lambda: |-
          it.fill(id(bg_color));
          it.printf(35, 20, id(font_main), id(text_color), "%s", "加载中");
      # 静音页面
      - id: muted_page
        lambda: |-
          it.fill(id(bg_color));
          it.printf(35, 20, id(font_main), id(text_color), "%s", "静音状态");
      # 吃药提醒页面（红灯状态下显示）
      - id: med_alarm_page
        lambda: |-
          it.fill(id(bg_color));
          it.printf(64, 10, id(font_main), id(text_color), esphome::display::TextAlign::TOP_CENTER, "该吃药了");
          it.printf(64, 32, id(font_main), id(text_color), esphome::display::TextAlign::TOP_CENTER, "第%d格", (int) id(med_active_slot) + 1);
      # 已吃药页面（打卡后绿灯期间显示）
      - id: med_ok_page
        lambda: |-
          it.fill(id(bg_color));
          it.printf(64, 20, id(font_main), id(text_color), esphome::display::TextAlign::TOP_CENTER, "已吃药");
