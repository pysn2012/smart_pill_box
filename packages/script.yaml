# 脚本 (Scripts): 封装了可重用的逻辑块
script:
  # 核心脚本：根据当前状态（WiFi/HA连接、语音助手阶段）决定显示哪个页面
  - id: draw_display
    then:
      - if:
          condition:
            # OLED 初始化失败（I2C 扫不到屏）时直接跳过绘制：
            # 对已 FAILED 的 display 调 show_page()/update() 会踩空帧缓冲（StoreProhibited, EXCVADDR 0）
            lambda: return !id(init_in_progress) && !id(oled128).is_failed();
          then:
            - if:
                condition:
                  wifi.connected:
                then:
                  - if:
                      condition:
                        api.connected:
                      then:
                        - lambda: |
                            // 吃药提醒优先级最高：提醒中显示"该吃药了"，打卡后显示"已吃药"
                            if (id(med_show_alarm)) {
                              id(oled128).show_page(med_alarm_page);
                              id(oled128).update();
                              return;
                            }
                            if (id(med_show_taken)) {
                              id(oled128).show_page(med_ok_page);
                              id(oled128).update();
                              return;
                            }
                            switch(id(voice_assistant_phase)) {
                              case ${voice_assist_listening_phase_id}:
                                id(oled128).show_page(listening_page);
                                id(oled128).update();
                                break;
                              case ${voice_assist_thinking_phase_id}:
                                id(oled128).show_page(thinking_page);
                                id(oled128).update();
                                break;
                              case ${voice_assist_replying_phase_id}:
                                id(oled128).show_page(replying_page);
                                id(oled128).update();
                                break;
                              case ${voice_assist_error_phase_id}:
                                id(oled128).show_page(error_page);
                                id(oled128).update();
                                break;
                              case ${voice_assist_muted_phase_id}:
                                id(oled128).show_page(muted_page);
                                id(oled128).update();
                                break;
                              case ${voice_assist_not_ready_phase_id}:
                                id(oled128).show_page(no_ha_page);
                                id(oled128).update();
                                break;
                              default:
                                id(oled128).show_page(idle_page);
                                id(oled128).update();
                            }
                      else:
                        - display.page.show: no_ha_page
                        - component.update: oled128
                else:
                  - display.page.show: no_wifi_page
                  - component.update: oled128
          else:
            - display.page.show: initializing_page
            - component.update: oled128

  # 根据配置的位置启动mWW或流式唤醒词
  - id: start_wake_word
    then:
      - if:
          condition:
            and:
              - not:
                  - voice_assistant.is_running:
              - lambda: return id(wake_word_engine_location).current_option() == "On device";
          then:
            - lambda: id(va).set_use_wake_word(false);
            - micro_wake_word.start:
      - if:
          condition:
            and:
              - not:
                  - voice_assistant.is_running:
              - lambda: return id(wake_word_engine_location).current_option() == "In Home Assistant";
          then:
            - lambda: id(va).set_use_wake_word(true);
            - voice_assistant.start_continuous:
  # 根据配置的位置停止mWW或流式唤醒词
  - id: stop_wake_word
    then:
      - if:
          condition:
            lambda: return id(wake_word_engine_location).current_option() == "In Home Assistant";
          then:
            - lambda: id(va).set_use_wake_word(false);
            - voice_assistant.stop:
      - if:
          condition:
            lambda: return id(wake_word_engine_location).current_option() == "On device";
          then:
            - micro_wake_word.stop:
  # 根据软件静音开关的状态，将语音助手阶段设置为空闲或静音
  - id: set_idle_or_mute_phase
    then:
      - if:
          condition:
            switch.is_off: mute
          then:
            - lambda: id(voice_assistant_phase) = ${voice_assist_idle_phase_id};

          else:
            - lambda: id(voice_assistant_phase) = ${voice_assist_muted_phase_id};